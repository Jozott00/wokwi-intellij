# Starter owns IDE startup, project isolation and shutdown. A display is required by JCEF.
name: Simulator Integration Tests
on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run simulator tests in an isolated IDE
        env:
          WOKWI_TEST_LICENSE: ${{ secrets.WOKWI_TEST_LICENSE }}
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew integrationTest --no-configuration-cache
      - name: Upload test reports and redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: |
            build/reports/tests/integrationTest
            build/test-results/integrationTest
            build/wokwi-tests/**/console*.txt
            build/wokwi-tests/**/failure.txt
            build/wokwi-tests/**/ide-errors.txt
            build/wokwi-tests/**/ide-logs
            build/wokwi-tests/**/screenshot*
          retention-days: 7
