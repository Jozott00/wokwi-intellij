# Starter owns IDE startup, project isolation and shutdown. A display is required by JCEF.
name: Simulator Integration Tests
on:
  workflow_call:
    secrets:
      WOKWI_TEST_LICENSE:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: IDE E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install AVR debugger
        run: sudo apt-get update && sudo apt-get install -y gdb-avr
      - name: Read test IDE cache identity
        id: test-ide
        shell: bash
        run: |
          awk -F= '/^platformType=|^platformVersion=/ { print $1 "=" $2 }' gradle.properties >> "$GITHUB_OUTPUT"
      # Starter downloads its IDE separately from Gradle's dependency cache.
      - name: Cache Starter IDE archive and installation
        uses: actions/cache@v4
        with:
          path: |
            out/ide-tests/installers
            out/ide-tests/cache/builds
          key: starter-ide-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.test-ide.outputs.platformType }}-${{ steps.test-ide.outputs.platformVersion }}
      - name: Run simulator tests in an isolated IDE
        env:
          WOKWI_TEST_LICENSE: ${{ secrets.WOKWI_TEST_LICENSE }}
          WOKWI_TEST_GDB: /usr/bin/avr-gdb
        run: xvfb-run -a -s '-screen 0 1920x1080x24' ./gradlew integrationTest --no-configuration-cache
      - name: Upload test reports and redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: |
            build/reports/tests/integrationTest
            build/test-results/integrationTest
            build/wokwi-tests/**/debugger*.txt
            build/wokwi-tests/**/console*.txt
            build/wokwi-tests/**/failure.txt
            build/wokwi-tests/**/ide-errors.txt
            build/wokwi-tests/**/ide-logs
            build/wokwi-tests/**/screenshot*
          retention-days: 7
